{% extends 'layouts/blank.html' %}

{% block head_title %} | st2026{% endblock %}

{% block content %} 

<div class="max-w-4xl mx-auto px-8 py-24">
    <div class="grid grid-cols-3 gap-6">
        <div class="col-span-2 rounded-xl">
            <img alt="A still of the show" class="rounded-xl w-full h-auto" src="https://stripe-camo.global.ssl.fastly.net/677ade84213d1db1c77afc0412206ed8214e8126cd4a34e94b1918ad52c815bb/68747470733a2f2f66696c65732e7374726970652e636f6d2f6c696e6b732f4d44423859574e6a6446387856564a784e5551324e444e5756474658576a524566475a735833526c6333526664334245543364586357643157474e355632354a65476446543159794d33646f30304a304b5178356265/6d65726368616e745f69643d616363745f315552713544363433565461575a344426636c69656e743d50524f445543545f415049">
        </div>
        <div class="pt-32">
            <h2>
                {{ product.name }}
            </h2>
            <p class="text-lg">
                £{{ product_price|floatformat:2 }}
            </p>

            <form enctype="multipart/form-data" method="post" role="product_page">
                {% csrf_token %}
                <input type="hidden" name="price_id" value="price_1UTRhN643VTaWZ4DCArbij4v"> 
                <input type="hidden" name="quantity" value="1"> 
                <button type="submit" class="!block !rounded-full !bg-black hover:!bg-neutral-500 active:scale-95 transition text-center !px-24" data-bind-href="pricing">
                    Buy
                </button>
            </form>

            <p class="pt-8 text-sm">
                {{ product.description }}
            </p>
        </div>
    </div>
</div>

{% endblock %}
