<div class="p-6" id="checkout_total">
    <h2>
        Sub total
    </h2>
    <p>
        Total: £{{ cart.get_total_price|floatformat:2 }}
    </p>
    <a class="button" href="{% url 'checkout' %}">
        Proceed to checkout
    </a>
</div>


<div class="hidden">
    <div hx-swap-oob="true" id="product-total-{{ product.item_id }}">     <!-- hx-swap- out-of-band -->
        £{{ product.total_price|floatformat:2 }}
    </div>
    {% if not product.quantity == 1 %}
        <div class="font-light pt-2 text-gray-400 text-sm">
            £{{ product.price|floatformat:2 }} each
        </div>
    {% endif %}
</div>
